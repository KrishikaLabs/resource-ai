
    
  
<!DOCTYPE html>
<html>
<head>
<title>RE:SOURCE AI</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
</head>
<body>

<h1>♻️ RE:SOURCE</h1>
<p>AI Resource Recovery</p> 
    <h2>Analyze an Object</h2>

<input id="photo" type="file" accept="image/*">

<br><br>

<img id="preview" width="250">

<br><br>

<button onclick="analyze()">🤖 Identify with AI</button>

<p id="status">AI is ready.</p>

<h2 id="result"></h2> 
    <script>
let model;

mobilenet.load().then(m=>{
  model=m;
  status.innerText="AI ready!";
});

async function analyze(){
  let f=photo.files[0];
  if(!f){alert("Upload a photo first!");return;}

  preview.src=URL.createObjectURL(f);
  status.innerText="AI identifying...";

  preview.onload=async()=>{
    let r=await model.classify(preview);

    result.innerText=
      "🤖 AI Identified: "+r[0].className+
      "\nConfidence: "+Math.round(r[0].probability*100)+"%";

    status.innerText="Analysis complete!";
  };
}
</script>

<p>♻️ RE:SOURCE — Discover resources hidden in discarded objects.</p>

</body>
</html>
